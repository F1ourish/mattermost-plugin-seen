name: seen-ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      package_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm install -g npm@11.9.0
      - run: make dist
      - run: webapp/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - run: make security-check
      - name: Validate release archive
        id: package
        run: python3 .github/release/check_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seen-candidate
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-validation-*.json
  prepare-release:
    needs: build
    if: >-
      github.repository == 'F1ourish/mattermost-plugin-seen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: seen-draft-release-1.1.2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare verified draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_TAR_SHA256: ${{ needs.build.outputs.package_sha256 }}
        run: python3 .github/release/prepare.py
